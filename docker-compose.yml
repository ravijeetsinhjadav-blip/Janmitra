version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: janmitra_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-janmitra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janmitra_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-janmitra_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - janmitra_network

  # ============================================================================
  # JanMitra FastAPI Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janmitra_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-janmitra_user}:${POSTGRES_PASSWORD:-janmitra_secure_password}@postgres:5432/${POSTGRES_DB:-janmitra_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-janmitra_production_jwt_secret_must_be_set_in_env_32chars}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://admin.janmitra.gov.in,https://app.janmitra.gov.in}
      DOCUMENT_STORAGE_PATH: storage/documents
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_DEV_MODE: "False"
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/storage/documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - janmitra_network

  # ============================================================================
  # React Admin Dashboard (Nginx)
  # ============================================================================
  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: janmitra_admin_dashboard
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - janmitra_network

volumes:
  postgres_data:
    name: janmitra_postgres_data
  document_storage:
    name: janmitra_document_storage

networks:
  janmitra_network:
    name: janmitra_network
    driver: bridge

