databases:
  - name: janmitra-db
    databaseName: janmitra
    user: janmitra_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: janmitra-backend
    runtime: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janmitra-db
          property: connectionString
      - key: ENVIRONMENT
        value: development
      - key: DEBUG
        value: "true"
      - key: OCR_PROVIDER
        value: mock
      - key: AI_PROVIDER
        value: mock
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
