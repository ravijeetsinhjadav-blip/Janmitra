databases:
  - name: janmitra-db
    databaseName: janmitra
    user: janmitra_user
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: janmitra-backend
    runtime: python
    region: singapore
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janmitra-db
          property: connectionString
      - key: ENVIRONMENT
        value: development
      - key: JWT_SECRET_KEY
        generateValue: true
